<style>
*{margin:0;padding:0;box-sizing:border-box}
body.login-mode{font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#333;display:flex;justify-content:center;align-items:center;min-height:100vh}
.login-container{background:#fff;padding:40px 36px;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.12);text-align:center;max-width:400px;width:90%}
.login-container h1{font-size:20px;color:#1a3a5c;margin-bottom:8px}
.login-container p{font-size:13px;color:#888;margin-bottom:24px}
.pw-wrap{position:relative;width:100%}
.pw-wrap input{width:100%;padding:12px 16px;padding-right:44px;border:1px solid #ccc;border-radius:6px;font-size:14px;outline:none}
.pw-wrap input:focus{border-color:#2d5f8a}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:#888}
.login-container>button{width:100%;padding:12px;margin-top:16px;background:#2d5f8a;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer}
.login-container>button:hover{background:#1a3a5c}
.error-msg{color:#c0392b;font-size:13px;margin-top:12px;display:none}
.lock-icon{font-size:48px;margin-bottom:16px}
</style>

function togglePw(){var i=document.getElementById("pwInput");i.type=i.type==="password"?"text":"password";i.focus()}
function unlock(){
  var pw=document.getElementById("pwInput").value,err=document.getElementById("errMsg");
  err.style.display="none";
  if(typeof CryptoJS==="undefined"){err.textContent="Crypto library failed to load.";err.style.display="block";return}
  try{
    var dec=CryptoJS.AES.decrypt(ED,pw).toString(CryptoJS.enc.Utf8);
    if(!dec||dec.length<50)throw new Error("x");
    var blob=new Blob([dec],{type:"text/html;charset=utf-8"});
    window.location.replace(URL.createObjectURL(blob));
  }catch(e){err.style.display="block";document.getElementById("pwInput").value="";document.getElementById("pwInput").focus()}
}
